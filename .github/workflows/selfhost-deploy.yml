name: Deploy self-hosted

on:
  workflow_dispatch:
    inputs:
      action:
        description: "upgrade (existing instance) or deploy (first time)"
        required: true
        default: upgrade
        type: choice
        options:
          - upgrade
          - deploy

# OIDC — short-lived AWS credentials, no stored keys
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Only runs on forks — never on the upstream wraps-team/wraps repo
    if: github.repository != 'wraps-team/wraps'
    runs-on: ubuntu-latest
    environment: production # requires manual approval if configured

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Upgrades run on a fresh runner with no .env.selfhost on disk.
      # SST reads config from .env.selfhost (infra/selfhost.config.ts),
      # so we reconstruct it from repository secrets before deploying.
      # BETTER_AUTH_SECRET / UNSUBSCRIBE_SECRET are the same repository secrets
      # required by the first-time deploy (generate with 'openssl rand -hex 32');
      # if you first deployed locally, copy them from .env.selfhost instead.
      - name: Reconstruct .env.selfhost (upgrade)
        if: inputs.action == 'upgrade'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WRAPS_LICENSE_KEY: ${{ secrets.WRAPS_LICENSE_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          SELFHOST_WEB_DOMAIN: ${{ vars.SELFHOST_WEB_DOMAIN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          # Optional. The API advertises these as its own (.well-known issuer,
          # SES webhook endpoint), so the upgrade backfills them from the deploy
          # outputs when absent — at the cost of a second SST pass every run.
          # Set them (copy from .env.selfhost after a deploy) to skip that pass.
          WRAPS_API_URL: ${{ vars.WRAPS_API_URL }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          WRAPS_EMAIL_ROLE_ARN: ${{ secrets.WRAPS_EMAIL_ROLE_ARN }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          AUTH_EMAIL_CONFIGURATION_SET: ${{ secrets.AUTH_EMAIL_CONFIGURATION_SET }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Optional. Selects the AI inference backend (default: the Vercel AI
          # Gateway). Set WRAPS_AI_PROVIDER=openai plus OPENAI_API_KEY to call
          # OpenAI directly.
          WRAPS_AI_PROVIDER: ${{ vars.WRAPS_AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          # Bedrock only (self-hosted). Falls back to AWS_REGION.
          WRAPS_AI_REGION: ${{ vars.WRAPS_AI_REGION }}
          # Optional. Your OWN Sentry project's DSN — this file is the only
          # source infra/selfhost.config.ts reads it from, so leaving it out
          # here turns error reporting OFF on the next upgrade even if a local
          # deploy had configured it.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Optional. infra/selfhost.config.ts reads these from .env.selfhost
          # only (never process.env), so omitting them here deletes the SNS
          # alert subscription and silently re-enables any cron the operator
          # opted out of, on the next automated upgrade.
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SELFHOST_ACCOUNT_HEALTH_ENABLED: ${{ vars.SELFHOST_ACCOUNT_HEALTH_ENABLED }}
          SELFHOST_EVENT_FEED_STALENESS_ENABLED: ${{ vars.SELFHOST_EVENT_FEED_STALENESS_ENABLED }}
          SELFHOST_WORKFLOW_REAPER_ENABLED: ${{ vars.SELFHOST_WORKFLOW_REAPER_ENABLED }}
          SELFHOST_BROADCAST_REAPER_ENABLED: ${{ vars.SELFHOST_BROADCAST_REAPER_ENABLED }}
          # Optional. Comma-separated IdP origins the SSO plugin may reach for
          # OIDC discovery (an Okta custom domain, an internal Keycloak).
          # Omitting it here breaks SSO provider registration on the next
          # automated upgrade for any org whose IdP is not in the built-in
          # allowlist in packages/auth.
          WRAPS_SSO_TRUSTED_ORIGINS: ${{ vars.WRAPS_SSO_TRUSTED_ORIGINS }}
          # Optional. Which DNS provider owns SELFHOST_WEB_DOMAIN. Omitting
          # these on a Cloudflare deployment drops it back to the Route 53
          # adapter, and the upgrade dies on the hosted-zone lookup.
          SELFHOST_DNS_PROVIDER: ${{ vars.SELFHOST_DNS_PROVIDER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELFHOST_CLOUDFLARE_ZONE_ID: ${{ vars.SELFHOST_CLOUDFLARE_ZONE_ID }}
          SELFHOST_ACM_CERT_ARN: ${{ vars.SELFHOST_ACM_CERT_ARN }}
        run: |
          # Validate required secrets are present
          missing=()
          [ -z "${DATABASE_URL}" ]       && missing+=("DATABASE_URL")
          [ -z "${WRAPS_LICENSE_KEY}" ]  && missing+=("WRAPS_LICENSE_KEY")
          [ -z "${BETTER_AUTH_SECRET}" ] && missing+=("BETTER_AUTH_SECRET (copy from .env.selfhost after first deploy)")
          [ -z "${UNSUBSCRIBE_SECRET}" ] && missing+=("UNSUBSCRIBE_SECRET (copy from .env.selfhost after first deploy)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for upgrade: ${missing[*]}"
            exit 1
          fi

          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "LICENSE_KEY=${WRAPS_LICENSE_KEY}"
            echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
            echo "UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET}"
            echo "SELFHOST_AWS_REGION=${AWS_REGION}"
            [ -n "${SELFHOST_WEB_DOMAIN}" ] && echo "SELFHOST_WEB_DOMAIN=${SELFHOST_WEB_DOMAIN}"
            [ -n "${NEXT_PUBLIC_APP_URL}" ] && echo "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}"
            [ -n "${WRAPS_API_URL}" ] && echo "WRAPS_API_URL=${WRAPS_API_URL}"
            [ -n "${BETTER_AUTH_URL}" ] && echo "BETTER_AUTH_URL=${BETTER_AUTH_URL}"
            [ -n "${WRAPS_EMAIL_ROLE_ARN}" ] && echo "WRAPS_EMAIL_ROLE_ARN=${WRAPS_EMAIL_ROLE_ARN}"
            [ -n "${AUTH_EMAIL_FROM}" ] && echo "AUTH_EMAIL_FROM=${AUTH_EMAIL_FROM}"
            [ -n "${AUTH_EMAIL_CONFIGURATION_SET}" ] && echo "AUTH_EMAIL_CONFIGURATION_SET=${AUTH_EMAIL_CONFIGURATION_SET}"
            [ -n "${AI_GATEWAY_API_KEY}" ] && echo "AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}"
            [ -n "${WRAPS_AI_PROVIDER}" ] && echo "WRAPS_AI_PROVIDER=${WRAPS_AI_PROVIDER}"
            [ -n "${AI_MODEL}" ] && echo "AI_MODEL=${AI_MODEL}"
            [ -n "${OPENAI_API_KEY}" ] && echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            [ -n "${OPENAI_BASE_URL}" ] && echo "OPENAI_BASE_URL=${OPENAI_BASE_URL}"
            [ -n "${ANTHROPIC_API_KEY}" ] && echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            [ -n "${ANTHROPIC_BASE_URL}" ] && echo "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}"
            [ -n "${WRAPS_AI_REGION}" ] && echo "WRAPS_AI_REGION=${WRAPS_AI_REGION}"
            [ -n "${SENTRY_DSN}" ] && echo "SENTRY_DSN=${SENTRY_DSN}"
            [ -n "${ALERT_EMAIL}" ] && echo "ALERT_EMAIL=${ALERT_EMAIL}"
            [ -n "${SELFHOST_ACCOUNT_HEALTH_ENABLED}" ] && echo "SELFHOST_ACCOUNT_HEALTH_ENABLED=${SELFHOST_ACCOUNT_HEALTH_ENABLED}"
            [ -n "${SELFHOST_EVENT_FEED_STALENESS_ENABLED}" ] && echo "SELFHOST_EVENT_FEED_STALENESS_ENABLED=${SELFHOST_EVENT_FEED_STALENESS_ENABLED}"
            [ -n "${SELFHOST_WORKFLOW_REAPER_ENABLED}" ] && echo "SELFHOST_WORKFLOW_REAPER_ENABLED=${SELFHOST_WORKFLOW_REAPER_ENABLED}"
            [ -n "${SELFHOST_BROADCAST_REAPER_ENABLED}" ] && echo "SELFHOST_BROADCAST_REAPER_ENABLED=${SELFHOST_BROADCAST_REAPER_ENABLED}"
            [ -n "${WRAPS_SSO_TRUSTED_ORIGINS}" ] && echo "WRAPS_SSO_TRUSTED_ORIGINS=${WRAPS_SSO_TRUSTED_ORIGINS}"
            [ -n "${SELFHOST_DNS_PROVIDER}" ] && echo "SELFHOST_DNS_PROVIDER=${SELFHOST_DNS_PROVIDER}"
            [ -n "${CLOUDFLARE_API_TOKEN}" ] && echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}"
            [ -n "${SELFHOST_CLOUDFLARE_ZONE_ID}" ] && echo "SELFHOST_CLOUDFLARE_ZONE_ID=${SELFHOST_CLOUDFLARE_ZONE_ID}"
            [ -n "${SELFHOST_ACM_CERT_ARN}" ] && echo "SELFHOST_ACM_CERT_ARN=${SELFHOST_ACM_CERT_ARN}"
            # A false `[ -n ... ]` above is the group's exit status, and the
            # group is this step's last command — without this the step fails
            # whenever the final optional secret is unset.
            true
          } > .env.selfhost

      # First-time deploys MUST receive the auth secrets from repository
      # secrets. This runner is ephemeral — secrets generated here would die
      # with it, and regenerating UNSUBSCRIBE_SECRET on the next deploy
      # invalidates every unsubscribe token ever issued.
      - name: Validate secrets (deploy)
        if: inputs.action == 'deploy'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          missing=()
          [ -z "${BETTER_AUTH_SECRET}" ] && missing+=("BETTER_AUTH_SECRET")
          [ -z "${UNSUBSCRIBE_SECRET}" ] && missing+=("UNSUBSCRIBE_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Generate each with 'openssl rand -hex 32' and add them under Settings → Secrets before deploying."
            exit 1
          fi

      - name: First-time deploy
        if: inputs.action == 'deploy'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WRAPS_LICENSE_KEY: ${{ secrets.WRAPS_LICENSE_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          WRAPS_AI_PROVIDER: ${{ vars.WRAPS_AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          WRAPS_AI_REGION: ${{ vars.WRAPS_AI_REGION }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # The optional values go in as flags, not env vars: deploy.ts reads
        # DATABASE_URL and WRAPS_LICENSE_KEY from the environment but
        # deliberately ignores an ambient SENTRY_DSN / AI_GATEWAY_API_KEY, so
        # nobody's shell can silently redirect a deployment's error stream.
        run: |
          args=(--yes)
          [ -n "${AI_GATEWAY_API_KEY}" ] && args+=(--ai-gateway-api-key "${AI_GATEWAY_API_KEY}")
          [ -n "${WRAPS_AI_PROVIDER}" ] && args+=(--ai-provider "${WRAPS_AI_PROVIDER}")
          [ -n "${AI_MODEL}" ] && args+=(--ai-model "${AI_MODEL}")
          [ -n "${OPENAI_API_KEY}" ] && args+=(--openai-api-key "${OPENAI_API_KEY}")
          [ -n "${OPENAI_BASE_URL}" ] && args+=(--openai-base-url "${OPENAI_BASE_URL}")
          [ -n "${ANTHROPIC_API_KEY}" ] && args+=(--anthropic-api-key "${ANTHROPIC_API_KEY}")
          [ -n "${ANTHROPIC_BASE_URL}" ] && args+=(--anthropic-base-url "${ANTHROPIC_BASE_URL}")
          [ -n "${WRAPS_AI_REGION}" ] && args+=(--ai-region "${WRAPS_AI_REGION}")
          [ -n "${SENTRY_DSN}" ] && args+=(--sentry-dsn "${SENTRY_DSN}")
          pnpm selfhost:deploy "${args[@]}"

      - name: Upgrade existing instance
        if: inputs.action == 'upgrade'
        run: pnpm selfhost:upgrade --yes
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
