name: Deploy API

# Gated on the Test workflow's verdict rather than on `push` directly.
#
# deploy-api used to call test.yml as a reusable workflow. test.yml carries a
# workflow-level `concurrency` group for the one shared Neon database, so the
# called copy and the standalone push-triggered run competed for that single
# slot. On 92413fa3 the called copy lost: all twelve jobs were cancelled and
# `deploy` was skipped — a production deploy that silently did not happen, and
# a run whose conclusion reads `cancelled` rather than `failure`.
#
# `workflow_run` reads the verdict of the suite that already ran for this SHA
# instead of starting a second one. The suite runs once per commit, the deploy
# waits for its conclusion, and a red suite never reaches the jobs below.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Least privilege: `gate` and `deploy` set their own permissions below. A
# job-level `permissions:` replaces this set rather than adding to it, so each
# restates everything it needs. `migrate` (migrate.yml) inherits this.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # `workflow_run` has no `paths:` filter, so the path list that used to live in
  # the `on: push` trigger is applied here instead — and against the last commit
  # this workflow actually deployed, not against HEAD^. The logic lives in
  # scripts/ci/deploy-gate.sh so scripts/__tests__/deploy-gate.test.ts can run it.
  #
  # Comparing to the last deployed commit is what makes a skip self-healing. A
  # HEAD^ comparison only sees the newest commit, so a multi-commit push, or a
  # deploy that was cancelled or failed, leaves its changes behind permanently:
  # the next push compares against a commit that never shipped and concludes
  # there is nothing to do. Diffing from the last success means every file
  # changed since the last thing that really reached production is considered,
  # however many pushes ago that was.
  #
  # "The last thing that really reached production" is read from a GitHub
  # Deployment in the `api-<stage>` environment, written by the last step of the
  # `deploy` job. It is not read from past runs of this workflow: a run whose
  # gate skipped still concludes `success`, and a `workflow_run` run's head_sha
  # is main's HEAD at trigger time, not the commit it tested. On 2026-11-03 that
  # made #247 (API) compare bf89a46..bf89a46 after the docs-only #248, skip, and
  # never deploy (runs 41681472352, 41683100866). The environment is named
  # `api-<stage>`, not `production`, so GitHub's automatic job-environment
  # deployment records (which carry github.sha, the same wrong commit) are never
  # read. The first run after this shipped finds no `api-production` record and
  # deploys; that is the intended bootstrap, and every failure to read the record
  # also falls through to deploying.
  #
  # GitHub-hosted, not the shared Blacksmith pool.
  #
  # On 2026-09-14 this job queued for 22h45m waiting for a blacksmith-2vcpu
  # runner to register (run 34877429952); the job then took 14s to execute, and
  # the whole release finished in under seven minutes once a runner appeared.
  # A run whose jobs never start does not fail — it still concludes `success` —
  # so a starved pool parks gate -> migrate -> deploy behind it while Vercel
  # ships apps/web on the same commit, which is the front/back skew that 404'd
  # /v1/agents*. GitHub-hosted capacity is elastic, so this job cannot wait on a
  # runner shortage; it is a cheap diff step that needs nothing from Blacksmith.
  #
  # timeout-minutes bounds a hung *run*. GitHub's 24h self-hosted queue cap is a
  # separate, fixed limit that no workflow setting can lower.
  gate:
    if: >-
      github.repository == 'wraps-team/wraps' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the `api-<stage>` deployment record; never writes it.
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the last successful deploy may be many pushes back.
          fetch-depth: 0

      - name: Decide whether this commit needs a deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          # A `workflow_run` trigger always deploys production, as `deploy` assumes.
          STAGE: ${{ github.event.inputs.stage || 'production' }}
        run: |
          # `workflow_run` uses this file as it is on main but checks out the
          # tested commit, so a commit older than scripts/ci/deploy-gate.sh can
          # land here. Fail loudly and do not deploy: deploying on a missing
          # script would also fire for any later re-run of Test on a pre-gate
          # commit, shipping that old code unconditionally. The commit that adds
          # the script runs its own gate, finds no record, and deploys.
          if [ ! -f scripts/ci/deploy-gate.sh ]; then
            echo "::error::scripts/ci/deploy-gate.sh does not exist at $HEAD_SHA (a commit from before the gate script landed); not deploying"
            exit 1
          fi
          bash scripts/ci/deploy-gate.sh

  # Migrate BEFORE deploying, not after. `sst deploy` publishes each Lambda's
  # new code the moment that function updates — well before the command returns
  # — so migrating afterwards leaves a window where new code runs against the
  # old schema. Any read or write touching a column the migration has not added
  # yet throws, and for the queue workers that means burned SQS retries and
  # dead-lettered chunks on a live broadcast.
  #
  # Safe because migrations are expected to be backward compatible: the
  # still-running old code ignores columns it does not know about. A migration
  # that REMOVES or renames still has to be split expand/contract across two
  # releases — no ordering makes that safe on its own.
  #
  # Failing this way round is also the better failure: a migration that dies
  # leaves old code on the old schema, which works. The other order leaves new
  # code on the old schema, which does not.
  #
  # This lives in its own workflow rather than a step below so that a broken
  # api build or an expired AWS role cannot stop the migration from running —
  # apps/web ships on the same commit through Vercel whether this job runs or
  # not, so the migration must not be hostage to anything but itself. See
  # migrate.yml, which also carries the repo-wide serialisation.
  migrate:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    uses: ./.github/workflows/migrate.yml
    with:
      stage: ${{ github.event.inputs.stage || 'production' }}
    secrets: inherit

  deploy:
    needs: [gate, migrate]
    if: needs.gate.outputs.deploy == 'true'
    # GitHub-hosted for the same reason as `gate`: this job was also pinned to
    # blacksmith-2vcpu-ubuntu-2404, so a runner shortage there stalled the
    # release even when `gate` had already decided to ship. Nothing in this job
    # runs until a runner is assigned, and GitHub-hosted capacity does not queue
    # behind a self-hosted pool's shortage.
    runs-on: ubuntu-latest
    # Bound a hung `sst deploy`; a normal run is ~5-14 minutes. This does not
    # cover queue time — GitHub caps self-hosted queue time at 24h instead.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC
      deployments: write # Writes the `api-<stage>` deployment record
    environment: ${{ github.event.inputs.stage || 'production' }}

    # Two `sst deploy` runs against one Pulumi stack fight over the state lock.
    # Nothing serialised this before; two pushes to main inside a few minutes
    # was enough. cancel-in-progress: false so a deploy is never killed halfway
    # through updating live Lambdas.
    concurrency:
      group: deploy-sst-${{ github.event.inputs.stage || 'production' }}
      cancel-in-progress: false

    steps:
      # The commit the suite went green on, not the branch tip. Under
      # `workflow_run` the default checkout is the default branch's head at
      # trigger time, which can already be a newer, untested commit.
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "@wraps/api^..." build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove system Pulumi (SST compatibility fix)
        run: sudo rm -f /usr/local/bin/pulumi-language-nodejs

      - name: Deploy SST
        run: pnpm exec sst deploy --stage ${{ github.event.inputs.stage || 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          WRAPS_API_KEY: ${{ secrets.WRAPS_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ needs.gate.outputs.sha }}

      # Record what reached the stage so the next run's gate diffs against it.
      # Runs only when `sst deploy` succeeded (the default `if: success()`), and
      # records the tested commit, not github.sha. `required_contexts: []` so the
      # API does not 409 on commit statuses; `auto_merge: false` so it does not
      # try to merge the base branch into the ref.
      #
      # Deliberately not `continue-on-error`: if this fails after `sst deploy`
      # succeeded, the job goes red on purpose. A deployment created but never
      # given its `success` status is skipped by the gate in favour of the
      # previous record, so the next run diffs against a stale baseline and a
      # revert of this deploy would look like "nothing changed". The red job is
      # the only signal, so re-run the `deploy` job (it repeats `sst deploy` for the same
      # commit, then records it) or dispatch a deploy.
      - name: Record the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.gate.outputs.sha }}
          STAGE: ${{ github.event.inputs.stage || 'production' }}
        run: |
          set -euo pipefail
          id=$(jq -n \
            --arg ref "$DEPLOYED_SHA" \
            --arg env "api-$STAGE" \
            --arg stage "$STAGE" \
            '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
              transient_environment: false, production_environment: ($stage == "production"),
              description: "Deploy API"}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          jq -n \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", log_url: $url, description: "sst deploy succeeded"}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - >/dev/null
          echo "recorded api-$STAGE deployment $id at $DEPLOYED_SHA"

      - name: Print outputs
        run: |
          echo "Deployment complete!"
          echo "Stage: ${{ github.event.inputs.stage || 'production' }}"
          echo "Commit: ${{ needs.gate.outputs.sha }}"
