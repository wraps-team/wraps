name: Release

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Parse tag into package metadata ──
  parse:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.meta.outputs.package }}
      npm_package: ${{ steps.meta.outputs.npm_package }}
      filter: ${{ steps.meta.outputs.filter }}
      dir: ${{ steps.meta.outputs.dir }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_cli: ${{ steps.meta.outputs.is_cli }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse release tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"

          # [a-z][a-z-]* not [a-z]+: package names may contain hyphens
          # (email-check). Greedy match backtracks to the last "-v", so
          # email-check-v1.1.1 parses as email-check / 1.1.1.
          if [[ "$TAG" =~ ^([a-z][a-z-]*)-v(.+)$ ]]; then
            PACKAGE="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::Tag must be <package>-v<version> (e.g., cli-v1.0.0)"
            exit 1
          fi

          case "$PACKAGE" in
            cli)    NPM_PACKAGE="@wraps.dev/cli";    FILTER="@wraps.dev/cli";    DIR="packages/cli" ;;
            cdk)    NPM_PACKAGE="@wraps.dev/cdk";    FILTER="@wraps.dev/cdk";    DIR="packages/cdk" ;;
            pulumi) NPM_PACKAGE="@wraps.dev/pulumi"; FILTER="@wraps.dev/pulumi"; DIR="packages/pulumi" ;;
            core)   NPM_PACKAGE="@wraps/core";       FILTER="@wraps/core";       DIR="packages/core" ;;
            mail)   NPM_PACKAGE="mail-audit";        FILTER="mail-audit";        DIR="packages/mail-audit" ;;
            email-check) NPM_PACKAGE="@wraps.dev/email-check"; FILTER="@wraps.dev/email-check"; DIR="packages/email-check" ;;
            *)      echo "::error::Unknown package '$PACKAGE'"; exit 1 ;;
          esac

          DIST_TAG="latest"
          [[ "$TAG" =~ -beta\. ]]  && DIST_TAG="beta"
          [[ "$TAG" =~ -alpha\. ]] && DIST_TAG="alpha"
          [[ "$TAG" =~ -rc\. ]]    && DIST_TAG="rc"

          IS_CLI=$([[ "$PACKAGE" == "cli" ]] && echo "true" || echo "false")

          {
            echo "package=$PACKAGE"
            echo "npm_package=$NPM_PACKAGE"
            echo "filter=$FILTER"
            echo "dir=$DIR"
            echo "dist_tag=$DIST_TAG"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "is_cli=$IS_CLI"
          } >> "$GITHUB_OUTPUT"

          echo "## Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** $NPM_PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dist tag:** $DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Standalone builds:** $IS_CLI" >> "$GITHUB_STEP_SUMMARY"

      # A package publishes with NPM_CONFIG_PROVENANCE, and the registry
      # validates the manifest against the signed provenance bundle. A missing
      # or mismatched repository.url is rejected with a 422 — after the build,
      # and for the CLI after four standalone binaries. mail-audit hit exactly
      # that on its first CI release (every earlier version was hand-published,
      # so the gap was invisible). Fail here instead, before any build runs.
      - name: Verify the manifest satisfies npm provenance
        env:
          PKG_DIR: ${{ steps.meta.outputs.dir }}
        run: |
          MANIFEST="$PKG_DIR/package.json"
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}"

          RAW=$(node -p "((require('./$MANIFEST').repository)||{}).url||''")
          # Accept the git+https:// prefix and the .git suffix npm also accepts.
          NORM=$(printf '%s' "$RAW" | sed -e 's#^git+##' -e 's#\.git$##')

          if [ -z "$RAW" ]; then
            echo "::error::$MANIFEST has no repository.url, which npm provenance requires. Add: \"repository\": { \"type\": \"git\", \"url\": \"$EXPECTED.git\", \"directory\": \"$PKG_DIR\" }"
            exit 1
          fi

          if [ "$NORM" != "$EXPECTED" ]; then
            echo "::error::$MANIFEST repository.url is \"$RAW\", which does not resolve to this repository ($EXPECTED). npm rejects a provenance bundle whose repository does not match."
            exit 1
          fi

          echo "repository.url OK: $RAW"

  # ── Fast track: non-CLI packages (npm publish + GH release) ──
  publish:
    needs: parse
    if: needs.parse.outputs.is_cli != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Pin npm: OIDC trusted publishing needs a recent npm, but npm@latest (12.0.0)
      # ships a broken bundle (missing sigstore) that fails provenance. 11.18.0 is the
      # version that published cli-v2.24.0 successfully.
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @wraps/core build
          pnpm --filter @wraps.dev/email-check build

      - name: Build package
        run: pnpm --filter ${{ needs.parse.outputs.filter }} build

      - name: Publish to npm
        run: |
          pnpm --filter ${{ needs.parse.outputs.filter }} publish \
            --access public --no-git-checks \
            --tag ${{ needs.parse.outputs.dist_tag }}
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.parse.outputs.tag }}"
          DIST_TAG="${{ needs.parse.outputs.dist_tag }}"
          PRERELEASE_FLAG=""
          [[ "$DIST_TAG" != "latest" ]] && PRERELEASE_FLAG="--prerelease"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Summary
        run: |
          echo "## Published ${{ needs.parse.outputs.npm_package }}@${{ needs.parse.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.parse.outputs.dist_tag }}" == "latest" ]]; then
            echo "npm install ${{ needs.parse.outputs.npm_package }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm install ${{ needs.parse.outputs.npm_package }}@${{ needs.parse.outputs.dist_tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── CLI: build standalone binaries (4 platforms in parallel) ──
  build-standalone:
    needs: parse
    if: needs.parse.outputs.is_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-latest
          - platform: darwin
            arch: x64
            runner: macos-15
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Pin npm@11.18.0 — npm@latest (12.0.0) has a broken sigstore bundle (fails provenance)
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @wraps/core build
          pnpm --filter @wraps.dev/email-check build
          pnpm --filter @wraps/db build

      - run: pnpm --filter @wraps.dev/cli build

      - name: Build standalone
        run: bash scripts/build-standalone.sh --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wraps-${{ matrix.platform }}-${{ matrix.arch }}
          path: wraps-*-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # ── CLI: npm publish + GH release with binaries ──
  release-cli:
    needs: [parse, build-standalone]
    if: needs.parse.outputs.is_cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Pin npm@11.18.0 — npm@latest (12.0.0) has a broken sigstore bundle (fails provenance)
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @wraps/core build
          pnpm --filter @wraps.dev/email-check build
          pnpm --filter @wraps/db build

      - name: Build CLI
        run: pnpm --filter @wraps.dev/cli build

      - name: Publish to npm
        run: |
          pnpm --filter @wraps.dev/cli publish \
            --access public --no-git-checks \
            --tag ${{ needs.parse.outputs.dist_tag }}
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Download standalone artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum wraps-*.tar.gz > CHECKSUMS.sha256

      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.parse.outputs.tag }}"
          VERSION="${{ needs.parse.outputs.version }}"
          DIST_TAG="${{ needs.parse.outputs.dist_tag }}"
          PRERELEASE_FLAG=""
          [[ "$DIST_TAG" != "latest" ]] && PRERELEASE_FLAG="--prerelease"

          gh release create "$TAG" wraps-*.tar.gz CHECKSUMS.sha256 \
            --repo "${{ github.repository }}" \
            --title "CLI v$VERSION" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG

      - name: Summary
        run: |
          echo "## Published @wraps.dev/cli@${{ needs.parse.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.parse.outputs.dist_tag }}" == "latest" ]]; then
            echo "npm install @wraps.dev/cli" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm install @wraps.dev/cli@${{ needs.parse.outputs.dist_tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
