packages:
  - apps/*
  - packages/*
  # local-only scratch package (gitignored) — including it bakes its deps into
  # the committed lockfile, which fresh clones then rewrite on first install
  - "!packages/video"
  - wraps

# Our own packages — the release-age gate exists to catch a compromised
# upstream publish, and we are the upstream.
# github.com/better-inbox/better-inbox, github.com/wraps-team/better-auth-wraps
minimumReleaseAgeExclude:
  - better-inbox
  - '@wraps.dev/better-auth'
  - '@wraps.dev/client@0.10.1'
  - '@wraps.dev/email@0.13.0'
  - '@wraps.dev/sms@0.2.0'
  - cn@0.2.4

# Version pins for transitive deps: advisory/CVE floors for indirect packages.
