packages:
  - apps/*
  - packages/*
  # local-only scratch package (gitignored) — including it bakes its deps into
  # the committed lockfile, which fresh clones then rewrite on first install
  - "!packages/video"
  - wraps

# better-inbox is our own package (github.com/better-inbox/better-inbox)
minimumReleaseAgeExclude:
  - better-inbox

catalog:
  '@aws-sdk/client-acm': 3.1074.0
  '@aws-sdk/client-cloudformation': 3.1074.0
  '@aws-sdk/client-cloudfront': 3.1074.0
  '@aws-sdk/client-cloudwatch': 3.1074.0
  '@aws-sdk/client-cloudwatch-logs': 3.1074.0
  '@aws-sdk/client-dynamodb': 3.1074.0
  '@aws-sdk/client-eventbridge': 3.1074.0
  '@aws-sdk/client-iam': 3.1074.0
  '@aws-sdk/client-lambda': 3.1074.0
  '@aws-sdk/client-mailmanager': 3.1074.0
  '@aws-sdk/client-pinpoint-sms-voice-v2': 3.1074.0
  '@aws-sdk/client-route-53': 3.1074.0
  '@aws-sdk/client-s3': 3.1074.0
  '@aws-sdk/client-scheduler': 3.1074.0
  '@aws-sdk/client-ses': 3.1074.0
  '@aws-sdk/client-sesv2': 3.1091.0
  '@aws-sdk/client-sns': 3.1074.0
  '@aws-sdk/client-sqs': 3.1074.0
  '@aws-sdk/client-ssm': 3.1074.0
  '@aws-sdk/client-sts': 3.1074.0
  '@aws-sdk/credential-providers': 3.1074.0
  '@aws-sdk/lib-dynamodb': 3.1074.0
  '@aws-sdk/s3-request-presigner': 3.1074.0
  '@aws-sdk/util-dynamodb': 3.996.5
  '@react-email/components': 1.0.12
  '@react-email/render': 2.0.9
  '@types/node': 24.10.0
  '@types/pg': ^8.20.0
  '@vitest/coverage-v8': 4.1.9
  '@vitest/ui': 4.1.9
  better-auth: 1.6.23
  better-inbox: 0.1.2
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  handlebars: 4.7.9
  pg: ^8.22.0
  posthog-node: ^5.46.1
  stripe: ^19.3.0
  tsdown: ^0.22.14
  tsup: ^8.5.1
  typescript: ^5.9.3
  vitest: 4.1.9
  zod: ^4.4.3

strictDepBuilds: true

allowBuilds:
  '@posthog/cli': set this to true or false
  '@pulumi/command': set this to true or false
  '@sentry-internal/node-cpu-profiler': set this to true or false
  '@sentry/cli': set this to true or false
  core-js: set this to true or false
  es5-ext: set this to true or false
  esbuild: set this to true or false
  protobufjs: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
